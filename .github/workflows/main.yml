name: cicd-giposmart
on:
  push:
    branches:
      - main

jobs:
  my_deploy_job:
    runs-on: ubuntu-latest
    name: deploy to prod
    # These permisions are needed to interact with GitHub's OIDC Tojen endpoint
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - run: npm ci

      - name: Build Project
        run: |
          npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
      
      # TEMPORARY — decodes the actual OIDC token GitHub sends, so we can
      # compare its `sub`/`aud` claims against the IAM role's trust policy
      # instead of guessing why AssumeRoleWithWebIdentity is rejected.
      # Safe to print: no secrets in these claims, just repo/ref metadata.
      # Remove this step once the mismatch is found.
      - name: Debug OIDC token claims
        run: |
          python3 -c "
          import json, os, base64, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          req = urllib.request.Request(url, headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(req))['value']
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          "

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: MySessionName
          
      
      - name: Copy files artifacts to s3 bucket
        run: |
          aws s3 sync ./dist s3://${{ vars.AWS_BUCKET_NAME }} --delete
        
